services:
  postgresdb:
    image: postgis/postgis:15-3.4
    restart: unless-stopped
    env_file: ./.env
    environment:
      - POSTGRES_USER=$POSTGRESDB_USER
      - POSTGRES_PASSWORD=$POSTGRESDB_ROOT_PASSWORD
      - POSTGRES_DB=$POSTGRESDB_DATABASE
    ports:
      - $POSTGRESDB_LOCAL_PORT:$POSTGRESDB_DOCKER_PORT
    volumes:
      - db:/var/lib/postgresql/data
      - ./db/db.sql:/docker-entrypoint-initdb.d/10-db.sql
      - ./db/fill_mock_data.sql:/docker-entrypoint-initdb.d/20-data.sql
  app:
    depends_on:
      - postgresdb
    build: ./app
    restart: unless-stopped
    env_file: ./.env
    ports:
      - $NODE_LOCAL_PORT:$NODE_DOCKER_PORT
    environment:
      - DB_HOST=postgresdb
      - DB_USER=$POSTGRESDB_USER
      - DB_PASSWORD=$POSTGRESDB_ROOT_PASSWORD
      - DB_NAME=$POSTGRESDB_DATABASE
      - DB_PORT=$POSTGRESDB_DOCKER_PORT
    stdin_open: true
    tty: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
  valhalla_server:
    image: ghcr.io/gis-ops/docker-valhalla/valhalla:latest
    container_name: valhalla_server
    ports:
      - "${VALHALLA_LOCAL_PORT}:${VALHALLA_DOCKER_PORT}"
    volumes:
      - ../valhalla_map:/custom_files
      - ../valhalla_map/valhalla.json:/custom_files/valhalla.json:ro 
    restart: unless-stopped

volumes:
  db:
